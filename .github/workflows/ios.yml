name: Build PES 2017 iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download default.xex from Fork Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pes
          gh release download --repo "${{ github.repository }}" --pattern "default.xex" --dir pes --clobber
          ls -lh pes/default.xex

      - name: Install build tools
        run: |
          brew install ninja cmake ldid ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-ios-${{ github.run_id }}
          restore-keys: |
            ccache-ios-

      - name: Download MoltenVK & Vulkan Headers
        run: |
          curl -fL -o MoltenVK.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-all.tar
          tar -xf MoltenVK.tar
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          MVK_FW="$PWD/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework"
          if [ ! -f "$MVK_FW/MoltenVK" ]; then
            echo "MoltenVK framework not found:"
            find MoltenVK -maxdepth 6 \( -name "*.framework" -o -name "*.xcframework" -o -name "*.dylib" \)
            exit 1
          fi
          lipo -info "$MVK_FW/MoltenVK"
          echo "MVK_FW=$MVK_FW" >> "$GITHUB_ENV"

      - name: Step 1-7 - Recompile Xbox 360 PPC to C++ (build.sh)
        run: |
          chmod +x build.sh
          RECOMPILE_ONLY=1 CMAKE_CC=clang CMAKE_CXX=clang++ ./build.sh

      - name: Patch CMakeLists.txt for iOS ARM64
        run: |
          python3 - << 'PYEOF'
          s = open("CMakeLists.txt").read()
          s = s.replace("if(ANDROID AND PES_ARMV82)", "if((ANDROID OR IOS) AND PES_ARMV82)")
          s = s.replace("target_link_options(pes17 PRIVATE -rdynamic)", "if(NOT APPLE)\n    target_link_options(pes17 PRIVATE -rdynamic)\nendif()")
          s = s.replace("add_subdirectory(tests)", "if(NOT IOS)\nadd_subdirectory(tests)\nendif()")
          s = s.replace("elseif(ANDROID)", "elseif(ANDROID OR IOS)")
          s = s.replace(
              "if(NOT ANDROID)\n        target_link_libraries(pes17 PRIVATE Vulkan::Vulkan)",
              "if(NOT ANDROID AND NOT IOS)\n        target_link_libraries(pes17 PRIVATE Vulkan::Vulkan)")
          open("CMakeLists.txt", "w").write(s)
          print("CMakeLists.txt patched for iOS: Vulkan via dlopen, no formal link")
          PYEOF

      - name: Configure and Build pes17 for iOS (ARM64)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: "1"
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPES17_DIAGNOSTICS=OFF \
            -DPES17_USE_SDL=ON \
            "-DCMAKE_CXX_FLAGS=-I/tmp/vulkan-headers/include -DPES17_VULKAN_DYNAMIC=1 -include $PWD/runtime/gpu/vulkan/loader.h -Wno-error" \
            -DCMAKE_EXE_LINKER_FLAGS="-liconv"
          ninja -C build-ios -k 0 pes17
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-ios-${{ github.run_id }}

      - name: Package .app and Sign with 4GB RAM Entitlements (.ipa)
        run: |
          mkdir -p Payload/PES2017.app/Frameworks
          BIN_PATH=$(find build-ios -name "pes17" -type f | head -1)
          test -n "$BIN_PATH" || { echo "pes17 binary not found"; exit 1; }
          echo "Binary: $BIN_PATH  size: $(wc -c < "$BIN_PATH") bytes"
          cp "$BIN_PATH" Payload/PES2017.app/pes17
          mkdir -p Payload/PES2017.app/Frameworks/MoltenVK.framework
          cp "$MVK_FW/MoltenVK" "$MVK_FW/Info.plist" Payload/PES2017.app/Frameworks/MoltenVK.framework/
          cp "$MVK_FW/MoltenVK" Payload/PES2017.app/Frameworks/libMoltenVK.dylib
          install_name_tool -add_rpath "@executable_path/Frameworks" Payload/PES2017.app/pes17 || true

          cat > Payload/PES2017.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>pes17</string>
            <key>CFBundleIdentifier</key>
            <string>com.wilder.pes2017recomp</string>
            <key>CFBundleName</key>
            <string>PES 2017</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST

          cat > entitlements.plist << 'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
            <key>com.apple.developer.kernel.extended-virtual-addressing</key>
            <true/>
          </dict>
          </plist>
          ENT

          ldid -Sentitlements.plist Payload/PES2017.app/pes17
          ldid -S Payload/PES2017.app/Frameworks/MoltenVK.framework/MoltenVK
          ldid -S Payload/PES2017.app/Frameworks/libMoltenVK.dylib
          zip -r9 PES2017-iOS.ipa Payload

      - name: Upload PES2017-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES2017-iOS-IPA
          path: PES2017-iOS.ipa
# Built for Europe (Es,Pt,El) disc - MoltenVK via dlopen (no formal link)
